run:
  pipeline_type: AdsRecPipeline
  steps: [simulate]
  log_level: INFO
  num_device: 0
  num_used_device: 0

simulate:
  type: simulate
  simulation:
    num_users: 8
    exposures_per_user: 6
    output_dir: traffic_output
    seed: 42
    start_timestamp: 1700000000
    horizon_seconds: 86400
    click_window_seconds: 30
    conversion_window_seconds: 3600
    latent_dim: 16
    feature_config:
      dynamic_windows:
        1h: 3600
        24h: 86400
        7d: 604800
      persist_sequence_features: true
      sequence_features:
        hist_exp_slots: {event_type: EXPOSURE, field: slot_id, max_len: 20}
        hist_exp_ads: {event_type: EXPOSURE, field: ad_id, max_len: 20}
        hist_clk_slots: {event_type: CLICK, field: slot_id, max_len: 20}
        hist_clk_ads: {event_type: CLICK, field: ad_id, max_len: 20}
        hist_clk_categories: {event_type: CLICK, field: ad_category, max_len: 20}
        hist_conv_slots: {event_type: CONVERSION, field: slot_id, max_len: 20}
        hist_conv_targets: {event_type: CONVERSION, field: conversion_target, max_len: 20}
      categorical_vocab:
        gender: [unknown, female, male]
        age_group: [unknown, "18_24", "25_34", "35_44", "45_plus"]
        region: [unknown, north, east, south, west]
        device_type: [unknown, phone, tablet, desktop]
        os_type: [unknown, android, ios, windows]
        user_segment: [unknown, new, active, high_intent]
        user_value_segment: [unknown, low, medium, high]
        slot_id: [unknown, slot_a, slot_b, slot_c]
        slot_type: [unknown, feed, search, detail]
        slot_position: [unknown, top, middle, bottom]
        ad_category: [unknown, commerce, content, finance, travel]
        objective_type: [unknown, click, activate, purchase]
        creative_type: [unknown, image, video, native]
        creative_size: [unknown, square, portrait, landscape]
        landing_page_type: [unknown, product, content, form]
        promotion_target: [unknown, purchase, activate, signup]
        traffic_source: [unknown, organic, search, push]
        app_category: [unknown, shopping]
        page_context: [unknown, home, search, detail]
        network_type: [unknown, wifi, 4g, 5g]
      numeric_ranges:
        user_registration_age: [10, 2000]
        ad_id: [1, 50]
        creative_id: [1, 30]
        campaign_id: [1, 10]
        advertiser_id: [1, 15]
        bid_price: [0.2, 3.0]
        ecpm: [1.0, 20.0]
        ad_quality_score: [0.4, 1.0]
        initial_offset_seconds: [0, 300]
        exposure_gap_seconds: [60, 1800]
