# Online execution contract. This file contains only model and task controls.
# The platform's input pipeline supplies TFRecord batches.
run:
  pipeline_type: AdsRecPipeline
  steps: [adcsp_flow_train, adcsp_flow_predict]
  log_level: INFO
  num_device: 0
  num_used_device: 0

input:
  type: TFRecordDataset
  # Keep the platform's standard input_column/load_conf sections here.
  # They are intentionally omitted from this model task template.

model:
  type: AdCSPPModel
  latent_dim: 16
  static_dim: 16
  context_dim: 16
  hidden_dim: 32
  seed: 42
  checkpoint_path: checkpoints/adcsp_model.weights.h5

adcsp_flow_predict:
  type: AdCSPPFlowPredictTask
  checkpoint_path: checkpoints/adcsp_model.weights.h5
  click_window_seconds: 30
  conversion_window_seconds: 3600

adcsp_flow_train:
  type: AdCSPPFlowTrainTask
  epochs: 1
  learning_rate: 0.001
  conversion_loss_weight: 2.0
  click_window_seconds: 30
  conversion_window_seconds: 3600
  checkpoint_path: checkpoints/adcsp_model.weights.h5

